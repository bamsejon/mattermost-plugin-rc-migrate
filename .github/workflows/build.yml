name: Build Plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build plugin bundle
        run: |
          go mod tidy
          go mod vendor
          make build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mattermost-plugin-rc-migrate
          path: dist/*.tar.gz

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
